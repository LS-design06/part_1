 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anime Haven</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
   <!-- ── Contact us section ── -->
  <section id="contact" class="section-full">
    <div class="contact-inner">
      <!-- Info -->
      <div class="contact-info">
        <p class="section-label">Reach Out</p>
        <h2>Contact<br>Us</h2>
        <div class="divider"></div>

        <div class="contact-detail">
          <div class="contact-detail-icon">📞</div>
          <div class="contact-detail-text">
            <span>Phone</span>
            <p>066 085 4745</p>
          </div>
        </div>
        <div class="contact-detail">
          <div class="contact-detail-icon">✉️</div>
          <div class="contact-detail-text">
            <span>Email</span>
            <p>animehaven@gmail.com</p>
          </div>
        </div>
        <div class="contact-detail">
          <div class="contact-detail-icon">📍</div>
          <div class="contact-detail-text">
            <span>Region</span>
            <p>South Africa</p>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div>
        <p class="section-label">Send a Message</p>
        <form class="contact-form" action="submit" method="post">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="enquiry">Enquiry</label>
            <textarea id="enquiry" name="enquiry" placeholder="Tell us what you're looking for…" required></textarea>
          </div>
          <div class="form-submit">
            <button type="submit" class="btn btn-primary">Send Enquiry</button>
          </div>
        </form>
      </div>
    </div>
  </section>
<!-- ── FOOTER ── -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Anime<span>Haven</span></div>
      <p class="footer-copy">&copy; 2026 Anime Haven. All rights reserved.</p>
      <nav class="footer-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
